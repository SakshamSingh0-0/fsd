<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        header { background: rgba(0, 0, 0, 0.1); backdrop-filter: blur(10px); padding: 20px 0; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; gap: 20px; }
        nav a { padding: 12px 25px; text-decoration: none; color: white; background: rgba(255, 255, 255, 0.2); border-radius: 50px; transition: all 0.3s ease; border: 2px solid transparent; }
        nav a:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); border-color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        .content { background: rgba(255, 255, 255, 0.95); padding: 60px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        h1 { font-size: 3em; color: #333; margin-bottom: 20px; }
        p { font-size: 1.2em; color: #666; line-height: 1.8; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/course">About</a>
            <a href="/login">Login</a>
        </nav>
    </header>
    <div class="container">
        <div class="content">
            <h1>Welcome to Home</h1>
            <p>Explore our amazing courses and join our community today.</p>
        </div>
    </div>
</body>
</html>
