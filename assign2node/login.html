<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; }
        header { background: rgba(0, 0, 0, 0.1); backdrop-filter: blur(10px); padding: 20px 0; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; gap: 20px; }
        nav a { padding: 12px 25px; text-decoration: none; color: white; background: rgba(255, 255, 255, 0.2); border-radius: 50px; transition: all 0.3s ease; border: 2px solid transparent; }
        nav a:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); border-color: white; }
        .container { max-width: 500px; margin: 60px auto; padding: 20px; }
        .login-box { background: rgba(255, 255, 255, 0.95); padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 2.5em; }
        form { display: flex; flex-direction: column; }
        input { padding: 15px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 1em; transition: border-color 0.3s ease; }
        input:focus { outline: none; border-color: #4facfe; }
        button { padding: 15px; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: transform 0.3s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3); }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/course">About</a>
            <a href="/login">Login</a>
        </nav>
    </header>
    <div class="container">
        <div class="login-box">
            <h1>Login</h1>
            <form>
                <input type="email" placeholder="📧 Email Address" required>
                <input type="password" placeholder="🔒 Password" required>
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
